[project]
name = "skinstinct-drafter-webhook"
version = "0.1.0"
requires-python = ">=3.12"
# What the Vercel function (api/webhook.py -> app/webhook_app.py) imports at
# runtime: the full bot. requirements.txt additionally has the local-only
# bits (pypdf for scripts/split_published.py, pytest via requirements-dev).
dependencies = [
    "flask>=3.0,<4",
    "python-telegram-bot>=21,<22",
    "google-genai>=1.10,<3",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6.0,<7",
    # Supabase (SUPABASE_DB_URL) - app/pg.py.
    "psycopg[binary]>=3.1,<4",
]

[tool.vercel]
# Vercel's Flask framework auto-detection scans the whole repo for a Flask
# app and got confused by app/ (this project's Telegram-bot package, not a
# Flask app) - api/webhook.py is the actual Flask entrypoint for the
# Vercel deployment. See README's "Vercel webhook" section.
entrypoint = "api.webhook:app"
